<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timbangan Persamaan Linear</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        
        body {
    font-family: 'Poppins', sans-serif;
    box-sizing: border-box;
    background: linear-gradient(160deg, #b3e5fc, #e3f2fd, #ffffff);
    background-size: 200% 200%;
    animation: gradientMove 8s ease infinite;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

        
        .weight {
            cursor: grab;
            user-select: none;
            transition: all 0.2s ease;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }
        
        .weight:hover {
            transform: scale(1.05);
        }
        
        .weight:active {
            cursor: grabbing;
        }
        
        .weight-x{
    width:40px;
    height:40px;
    background-image:url("https://i.imgur.com/Labz1hK.png");
    background-size:75%; /* perkecil icon */
    background-repeat:no-repeat;
    background-position:center;
    margin:2px;
    padding:4px;
}
        
        .weight-1 {
            background-color: #10b981;
        }
        
        .drop-zone {
            transition: background-color 0.3s;
            border: 2px dashed #d1d5db;
        }
        
        .drop-zone.highlight {
            background-color: rgba(59, 130, 246, 0.1);
            border-color: #3b82f6;
        }
        
        .fulcrum {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        
        .beam {
            transform-origin: center bottom;
            transition: transform 0.5s ease-in-out;
        }
        
        @keyframes correct-animation {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .correct-animation {
            animation: correct-animation 0.5s ease-in-out;
        }
        footer {
  background: white;
  color: black;
  padding: 8px;
  font-weight: 500;
  position: fixed;
  bottom: 0;
  width: 100%;
  text-align: center;
  box-shadow: 0 -4px 10px rgba(0,0,0,0.15); /* Tambahkan ini */
}
    </style>
</head>
<body>
  <audio id="backsound" loop>
  <source src="https://raw.githubusercontent.com/dilan-math/plsv/master/Backsound%20Game.mp3" type="audio/mpeg">
</audio>
  <!-- Tombol Fullscreen -->
<button id="fullscreen-btn" 
    class="fixed top-3 right-3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-3 rounded shadow-lg z-50">
    ⛶
</button>

    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <h1 class="text-3xl font-bold text-center text-black mb-6">Timbangan Persamaan Linear Satu Variabel</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-[1.2fr_1fr] gap-6">
            <!-- Panel Kiri: Soal dan Keypad -->
            <div class="space-y-6">
                <!-- Panel Soal -->
                <div class="bg-white rounded-xl shadow-lg p-6">
                   
                    <div class="space-y-4">
                        <div class="flex items-center">
                            <button id="prev-question" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-l">
                                ←
                            </button>
                            <div id="question-number" class="bg-gray-100 py-2 px-4 text-center font-medium">
                                Soal 1/10
                            </div>
                            <button id="next-question" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-r">
                                →
                            </button>
                        </div>
                        
                        <div id="question-display" class="text-lg font-medium text-center py-4 bg-blue-50 rounded-lg">
                            x + 2 = 5
                        </div>
                        
                        <div class="mt-6">
                            <label for="answer" class="block text-sm font-medium text-gray-700 mb-1">Jawaban (nilai △):</label>
                            <div class="flex space-x-2">
                                <input type="text" id="answer" 
class="flex-1 border border-gray-300 rounded-md shadow-sm py-2 px-3 bg-gray-50 cursor-default select-none"
placeholder="Nilai △" readonly>

                                <button id="check-answer" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                                    Periksa
                                </button>
                            </div>
                        </div>
                        
                        <div id="feedback" class="mt-4 p-3 rounded-md hidden">
                            <!-- Feedback will be shown here -->
                        </div>
                    </div>
                </div>
                
                <!-- Keypad untuk input nilai x -->
                <div class="bg-white rounded-xl shadow-lg p-6">
             
                    <div class="max-w-xs mx-auto">
                        <div class="grid grid-cols-3 gap-2 mb-4">
                            <button class="keypad-btn bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 px-4 rounded text-lg" data-number="7">7</button>
                            <button class="keypad-btn bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 px-4 rounded text-lg" data-number="8">8</button>
                            <button class="keypad-btn bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 px-4 rounded text-lg" data-number="9">9</button>
                            <button class="keypad-btn bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 px-4 rounded text-lg" data-number="4">4</button>
                            <button class="keypad-btn bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 px-4 rounded text-lg" data-number="5">5</button>
                            <button class="keypad-btn bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 px-4 rounded text-lg" data-number="6">6</button>
                            <button class="keypad-btn bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 px-4 rounded text-lg" data-number="1">1</button>
                            <button class="keypad-btn bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 px-4 rounded text-lg" data-number="2">2</button>
                            <button class="keypad-btn bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 px-4 rounded text-lg" data-number="3">3</button>
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <button id="clear-btn" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded text-lg">C</button>
                            <button class="keypad-btn bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 px-4 rounded text-lg" data-number="0">0</button>
                            <button id="backspace-btn" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-4 rounded text-lg">⌫</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Panel Kanan: Timbangan -->
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h2 class="text-xl font-semibold mb-2 text-center text-gray-800">Timbangan</h2>
                
                <!-- Scale Container -->
                <div class="relative h-[200px] mb-16">
                    <div class="scale-container relative h-full flex items-start justify-center">
                        <!-- Fulcrum (Tumpuan Timbangan) -->
                        <div class="fulcrum w-[70px] h-[70px]">
                            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                                <polygon points="0,100 100,100 50,0" fill="#64748b" />
                            </svg>
                        </div>
                        
                        <!-- Beam (Batang Timbangan) -->
                        <div id="beam" class="beam absolute bottom-[70px] w-[80%] h-5 bg-gray-700 rounded-full">
                            <!-- Left Pan -->
                            <div class="absolute -top-[20px] left-[20%] transform -translate-x-1/2">
                                <div id="left-pan" class="drop-zone w-[140px] h-[140px] bg-gray-100 rounded-lg flex flex-wrap content-start p-2 shadow-md">
                                    <!-- Left weights will be placed here -->
                                </div>
                            </div>
                            
                            <!-- Right Pan -->
                            <div class="absolute -top-[20px] right-[20%] transform translate-x-1/2">
                                <div id="right-pan" class="drop-zone w-[140px] h-[140px] bg-gray-100 rounded-lg flex flex-wrap content-start p-2 shadow-md">
                                    <!-- Right weights will be placed here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Beban yang tersedia -->
                <div class="mt-8">
                    <h3 class="font-medium text-gray-800 mb-4 text-center">Beban yang tersedia:</h3>
                    <div class="flex justify-center gap-4">
                        <div class="weight weight-x shadow-md"
draggable="true"
data-weight="x">
</div>
                        <div class="weight weight-1 rounded-md p-2 text-white font-bold text-center w-[40px] h-[40px] flex items-center justify-center text-base shadow-md" draggable="true" data-weight="1">1</div>
                    </div>
                </div>
                
                <div class="mt-6 text-center">
                    <button id="reset-scale" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-6 rounded">
                        Reset Timbangan
                    </button>
                </div>
            </div>
        </div>
    </div>
<footer>

  </footer>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
          const backsound = document.getElementById('backsound');

document.body.addEventListener('click', function startMusic() {
    backsound.volume = 0.3; // volume 30%
    backsound.play().catch(()=>{});
    document.body.removeEventListener('click', startMusic);
}, { once:true });
            const questions = [

{ equation: "△ + 2 = 5", answer:3 },
{ equation: "△ + 6 = 8", answer:2 },
{ equation: "2△ + 3 = △ + 6", answer:3 },
{ equation: "2△ + 1 = 3△", answer:1 },
{ equation: "3 + 2△ = 7", answer:2 },
{ equation: "△ + 4 = 7", answer:3 },
{ equation: "3△ = 6", answer:2 },
{ equation: "△ + 7 = 10", answer:3 },
{ equation: "2△ + 1 = 7", answer:3 },
{ equation: "4△ + 3 = 7", answer:1 }

];
            
            let currentQuestionIndex = 0;
            
            // DOM elements
            const questionDisplay = document.getElementById('question-display');
            const questionNumber = document.getElementById('question-number');
            const prevButton = document.getElementById('prev-question');
            const nextButton = document.getElementById('next-question');
            const answerInput = document.getElementById('answer');
            const checkButton = document.getElementById('check-answer');
            const feedback = document.getElementById('feedback');
            const leftPan = document.getElementById('left-pan');
            const rightPan = document.getElementById('right-pan');
            const beam = document.getElementById('beam');
            const resetButton = document.getElementById('reset-scale');
            const weights = document.querySelectorAll('.weight');
            const keypadBtns = document.querySelectorAll('.keypad-btn');
            const clearBtn = document.getElementById('clear-btn');
            const backspaceBtn = document.getElementById('backspace-btn');

// Sound Effect
const soundBenar = new Audio(
'https://raw.githubusercontent.com/dilan-math/plsv/4ca88c5eb6a02d80d2e875ebb0b472fcc6ffd205/benar-uzi.wav'
);

const soundSalah = new Audio(
'https://raw.githubusercontent.com/dilan-math/plsv/4ca88c5eb6a02d80d2e875ebb0b472fcc6ffd205/salah-uzi.wav'
);

soundBenar.preload = "auto";
soundSalah.preload = "auto";
            
            // Display current question
            function displayQuestion() {
                const question = questions[currentQuestionIndex];
                questionDisplay.innerHTML =
question.equation.replaceAll("x","△");
                questionNumber.textContent = `Soal ${currentQuestionIndex + 1}/10`;
                answerInput.value = '';
                feedback.classList.add('hidden');
                updateScale();
            }
            
            // Navigation buttons
            prevButton.addEventListener('click', function() {
                if (currentQuestionIndex > 0) {
                    currentQuestionIndex--;
                    displayQuestion();
                    resetScale();
                }
            });
            
            nextButton.addEventListener('click', function() {
                if (currentQuestionIndex < questions.length - 1) {
                    currentQuestionIndex++;
                    displayQuestion();
                    resetScale();
                }
            });
            
            // Check answer
            checkButton.addEventListener('click', function() {
                const userAnswer = parseInt(answerInput.value);
                const correctAnswer = questions[currentQuestionIndex].answer;
                
                feedback.classList.remove('hidden');
                
              if (userAnswer === correctAnswer) {

    soundBenar.currentTime = 0;
    soundBenar.play();

    feedback.textContent = "Benar! Jawaban Anda tepat.";
    feedback.classList.remove('bg-red-100', 'text-red-700');
    feedback.classList.add('bg-green-100', 'text-green-700');
    feedback.classList.add('correct-animation');

    setTimeout(() => {
        feedback.classList.remove('correct-animation');
    }, 500);

} else {

    soundSalah.currentTime = 0;
    soundSalah.play();

    feedback.textContent = "Belum tepat. Coba lagi!";
    feedback.classList.remove('bg-green-100', 'text-green-700');
    feedback.classList.add('bg-red-100', 'text-red-700');

    answerInput.value = '';
}

            });
            
            // Drag and drop functionality with touch support
            let draggedWeight = null;
            let touchStarted = false;
            
            weights.forEach(weight => {
                // Mouse events
                weight.addEventListener('dragstart', function(e) {
                    e.dataTransfer.setData('text/plain', weight.dataset.weight);
                    weight.style.opacity = '0.5';
                });
                
                weight.addEventListener('dragend', function() {
                    weight.style.opacity = '1';
                });
                
                // Touch events for tablet
                weight.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    touchStarted = true;
                    draggedWeight = weight.dataset.weight;
                    weight.style.opacity = '0.5';
                }, { passive: false });
                
                weight.addEventListener('touchmove', function(e) {
                    e.preventDefault();
                    if (!touchStarted) return;
                    
                    const touch = e.touches[0];
                    const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
                    
                    // Remove highlight from all pans
                    leftPan.classList.remove('highlight');
                    rightPan.classList.remove('highlight');
                    
                    // Add highlight to current pan
                    if (elementBelow && (elementBelow === leftPan || leftPan.contains(elementBelow))) {
                        leftPan.classList.add('highlight');
                    } else if (elementBelow && (elementBelow === rightPan || rightPan.contains(elementBelow))) {
                        rightPan.classList.add('highlight');
                    }
                }, { passive: false });
                
                weight.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    if (!touchStarted) return;
                    
                    const touch = e.changedTouches[0];
                    const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
                    
                    // Remove highlights
                    leftPan.classList.remove('highlight');
                    rightPan.classList.remove('highlight');
                    weight.style.opacity = '1';
                    
                    // Check if dropped on a pan
                    let targetPan = null;
                    if (elementBelow && (elementBelow === leftPan || leftPan.contains(elementBelow))) {
                        targetPan = leftPan;
                    } else if (elementBelow && (elementBelow === rightPan || rightPan.contains(elementBelow))) {
                        targetPan = rightPan;
                    }
                    
                    if (targetPan && draggedWeight) {
                        addWeightToPan(targetPan, draggedWeight);
                    }
                    
                    touchStarted = false;
                    draggedWeight = null;
                }, { passive: false });
            });
            
            // Helper function to add weight to pan
            function addWeightToPan(pan, weightType) {
                const newWeight = document.createElement('div');
                if (weightType === 'x') {
    newWeight.classList.add(
        'weight',
        'weight-x',
        'shadow-md',
        'cursor-pointer'
    );
} 
                else {
                    newWeight.classList.add('weight', 'weight-1', 'rounded-md', 'p-1', 'text-white', 'font-bold', 
                                           'text-center', 'w-8', 'h-8', 'flex', 'items-center', 'justify-center', 
                                           'text-sm', 'shadow-md', 'm-1', 'cursor-pointer');
                }
                if(weightType!=="x"){
    newWeight.textContent=weightType;
}
                newWeight.dataset.weight = weightType;
                
                // Add click event to remove weight
                newWeight.addEventListener('click', function() {
                    newWeight.remove();
                    updateScale();
                });
                
                pan.appendChild(newWeight);
                updateScale();
            }
            
            // Handle drop zones
            [leftPan, rightPan].forEach(pan => {
                pan.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    pan.classList.add('highlight');
                });
                
                pan.addEventListener('dragleave', function() {
                    pan.classList.remove('highlight');
                });
                
                pan.addEventListener('drop', function(e) {
                    e.preventDefault();
                    pan.classList.remove('highlight');
                    
                    const weightType = e.dataTransfer.getData('text/plain');
                    
                    if (weightType) {
                        addWeightToPan(pan, weightType);
                    }
                });
            });
            
            // Reset scale
            resetButton.addEventListener('click', resetScale);
            
            function resetScale() {
                leftPan.innerHTML = '';
                rightPan.innerHTML = '';
                updateScale();
            }
            
            // Update scale balance
            function updateScale() {
                const leftWeights = Array.from(leftPan.children);
                const rightWeights = Array.from(rightPan.children);
                
                const leftXCount = leftWeights.filter(w => w.dataset.weight === 'x').length;
                const left1Count = leftWeights.filter(w => w.dataset.weight === '1').length;
                const rightXCount = rightWeights.filter(w => w.dataset.weight === 'x').length;
                const right1Count = rightWeights.filter(w => w.dataset.weight === '1').length;
                
                const currentAnswer = questions[currentQuestionIndex].answer;
                const leftValue = (leftXCount * currentAnswer) + left1Count;
                const rightValue = (rightXCount * currentAnswer) + right1Count;
                
                const difference = leftValue - rightValue;
                
                if (difference === 0) {
                    beam.style.transform = 'rotate(0deg)';
                } else {
                    const maxTilt = 15;
                    const tiltAngle = Math.sign(difference) * Math.min(Math.abs(difference) * 3, maxTilt);
                    beam.style.transform = `rotate(${-tiltAngle}deg)`;
                }
            }
            
            // Keypad functionality
            keypadBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    answerInput.value += this.dataset.number;
                });
            });
            
            clearBtn.addEventListener('click', function() {
                answerInput.value = '';
            });
            
            backspaceBtn.addEventListener('click', function() {
                answerInput.value = answerInput.value.slice(0, -1);
            });
            
            // Initialize
            displayQuestion();
        });
    </script>
